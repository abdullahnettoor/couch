# Puts a published stable release's dmg on the Gumroad product (scripts/gumroad-upload.mjs): it becomes the product's
# only file, with its download block at the top of the Content page. Betas are skipped. See SHIPPING.md, "Gumroad".
name: Gumroad

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to put on Gumroad, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: gumroad

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Upload the dmg to Gumroad
        env:
          GH_TOKEN: ${{ github.token }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/gumroad-upload.mjs "$TAG"
