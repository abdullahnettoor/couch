# Builds, signs and publishes Couch when a version tag (v1.2.3) is pushed. See SHIPPING.md, "Releasing".
# Run it by hand (Actions → Release → Run workflow) for a trial build: same steps, files kept as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15 # Apple Silicon: Couch ships arm64 only.
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      COUCH_REQUIRE_VMP: "1"
      COUCH_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install mpv and the castLabs EVS client
        run: |
          brew install mpv
          python -m pip install castlabs-evs

      - name: Check the EVS sign-in
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: python -m castlabs_evs.account --no-ask refresh

      - name: Import the release signing certificate
        env:
          P12: ${{ secrets.COUCH_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.COUCH_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::COUCH_SIGNING_P12 is not set: see SHIPPING.md, 'Releasing'"
            exit 1
          fi
          keychain="$RUNNER_TEMP/couch-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/couch.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/couch.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/couch.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Sign by the certificate's SHA-1: codesign accepts a self-signed identity that way without trusting it.
          identity=$(security find-certificate -a -Z -c "Couch Release Signing" "$keychain" | awk '/SHA-1/ { print $NF; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No 'Couch Release Signing' certificate in COUCH_SIGNING_P12"
            exit 1
          fi
          echo "COUCH_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "COUCH_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Couch.app
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          COUCH_TMDB_TOKEN: ${{ secrets.COUCH_TMDB_TOKEN }}
        run: pnpm run package

      - name: Make the zip, dmg and GPL source bundle
        run: pnpm run release:assets

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A beta (a version with a hyphen) is published at once as a pre-release, for the beta channel; stable
          # versions start as a draft to test and publish by hand. update.electronjs.org ignores both.
          case "$GITHUB_REF_NAME" in
            *-*) state="--prerelease" ;;
            *) state="--draft" ;;
          esac
          gh release create "$GITHUB_REF_NAME" out/release/* \
            $state --verify-tag --generate-notes --title "Couch ${GITHUB_REF_NAME#v}"

      # Publishing a stable release by hand runs beta-feed.yml; a release this workflow creates can't trigger it.
      - name: Update the beta feed
        if: github.ref_type == 'tag' && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/beta-feed.mjs

      - name: Keep the trial build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: couch-trial-${{ github.run_number }}
          path: out/release/
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "$COUCH_KEYCHAIN" ]; then security delete-keychain "$COUCH_KEYCHAIN"; fi
